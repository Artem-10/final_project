apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-backend
  labels:
    app: python-backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-backend
  template:
    metadata:
      labels:
        app: python-backend
    spec:
      containers:
      - name: python-backend
        namespace: artemj-danit
        image: aartemdevops10/python-backend:936404525ac161c27a8dcc4ab979c15016206c91
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "50Mi"
            cpu: "64m"
          limits:
            memory: "100Mi"
            cpu: "128m"
