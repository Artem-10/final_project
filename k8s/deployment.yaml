apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-backend
  labels:
    app: python-backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-backend
  template:
    metadata:
      labels:
        app: python-backend
    spec:
      containers:
      - name: python-backend
        image: aartemdevops10/python-backend:76cf7e582e55753ed35c28cd2b2a9599b8d7715d
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "50Mi"
            cpu: "64m"
          limits:
            memory: "100Mi"
            cpu: "128m"
