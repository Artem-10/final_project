name: Docker Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v4
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/python-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/python-backend:${{ github.sha }}

      - name: Update Kubernetes resources
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/python-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/python-backend:${{ github.sha }}|g" k8s/deployment.yaml
          git add k8s/deployment.yaml
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}